name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README files
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
          BIRTHDAY: ${{ vars.BIRTHDAY }}
        run: python today.py
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          git config --global user.email "feroanmothy666@gmail.com"
          git config --global user.name "Feroan101/GitHub-Actions-Bot"
          git add .
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "Update README"
            git push https://github.com/${{ github.repository }}.git HEAD:main
          }